<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW ARENA | النظام الخارق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe; --gold: #ffd700; --danger: #ff4b2b; --success: #00b09b; --purple: #8e2de2;
            --bg: #08080a; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; outline: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }

        #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px); color: white; padding: 15px; border-radius: 12px; border-right: 5px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.8); font-weight: bold; animation: slideDown 0.3s ease; }
        .toast.error { border-color: var(--danger); } .toast.gold { border-color: var(--gold); } .toast.success { border-color: var(--success); }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #111, #000); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--glass); border: 1px solid var(--border); padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 50px rgba(0, 242, 254, 0.1); backdrop-filter: blur(20px); }
        
        .cyber-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #333; padding: 15px; border-radius: 12px; color: white; font-size: 1rem; text-align: center; font-family: 'Cairo'; margin: 10px 0; transition: 0.3s; }
        .cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,242,254,0.3); }
        
        .cyber-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; text-transform: uppercase; }
        .cyber-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-main { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; }
        .btn-gold { background: linear-gradient(45deg, var(--gold), #ffae00); color: #000; }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #ff8008); color: white; }
        .btn-success { background: linear-gradient(45deg, var(--success), #96c93d); color: #000; }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: none; opacity: 0; transition: 0.8s; }
        .app-container.visible { display: block; opacity: 1; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(20,20,25,0.9), rgba(10,10,15,0.9)); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-weight: bold; }
        .avatar { width: 50px; height: 50px; background: linear-gradient(45deg, var(--primary), var(--purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 1.2rem; border: 2px solid var(--gold); }

        .nav-dock { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 20px; border: 1px solid var(--border); flex-wrap: wrap; }
        .dock-btn { background: transparent; border: none; color: #888; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 12px; font-family: 'Cairo'; transition: 0.3s; }
        .dock-btn.active { background: var(--glass); color: white; border: 1px solid var(--primary); box-shadow: 0 0 15px rgba(0,242,254,0.2); }

        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .active-game-box { background: rgba(15,15,20,0.9); border: 1px solid var(--primary); border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 0 40px rgba(0,242,254,0.1); }
        
        .chat-container { display: flex; flex-direction: column; height: 500px; background: rgba(10,10,15,0.9); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chat-msg { background: var(--glass); padding: 12px 18px; border-radius: 15px; width: fit-content; max-width: 80%; line-height: 1.5; text-align: right; }
        .chat-msg.bot { border-right: 3px solid var(--primary); align-self: flex-start; }
        .chat-msg.me { border-left: 3px solid var(--gold); align-self: flex-end; background: rgba(255,215,0,0.1); }
        .chat-name { font-size: 0.8rem; color: #888; margin-bottom: 5px; font-weight: bold; }
        .chat-input-area { display: flex; gap: 10px; padding: 15px; background: rgba(0,0,0,0.5); border-top: 1px solid var(--border); }

        .cyber-table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: right; }
        .cyber-table th, .cyber-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cyber-table th { color: var(--primary); background: rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1 style="color: var(--primary); font-size: 2.5rem; margin-bottom: 5px;">GW ARENA</h1>
            <p style="color: var(--gold); margin-bottom: 25px; font-weight: bold;">أقوى نظام تشغيل وتوليد 🚀</p>
            <input type="text" id="username" class="cyber-input" placeholder="اسم المستخدم">
            <input type="password" id="password" class="cyber-input" placeholder="كلمة المرور">
            <button class="cyber-btn btn-main" onclick="handleLogin()" style="margin-top: 15px;">دخول المنصة</button>
            <div style="margin-top: 20px; color: #888; font-size: 0.95rem; cursor: pointer;" onclick="toggleAuthMode()" id="auth-switch-text">عضو جديد؟ اضغط هنا للتسجيل</div>
        </div>
    </div>

    <div id="app" class="app-container">
        <div class="header-bar">
            <div class="user-info">
                <div class="avatar" id="avatar-char">?</div>
                <div>
                    <div id="display-name" style="color: #fff; font-size: 1.1rem;">Guest</div>
                    <div id="display-xp" style="color: var(--primary); font-weight: 900; font-size: 0.9rem;">0 XP</div>
                </div>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div style="color: var(--gold); font-weight: 900; font-size: 1.2rem; background: rgba(255,215,0,0.1); padding: 5px 15px; border-radius: 10px; border: 1px solid var(--gold);" id="display-level">LVL 1</div>
                <button onclick="logout()" style="background: rgba(255, 75, 43, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">خروج</button>
            </div>
        </div>

        <div class="nav-dock">
            <button class="dock-btn active" onclick="switchTab('chat', this)">💬 الشات والتوليد الآلي</button>
            <button class="dock-btn" onclick="switchTab('leaderboard', this)">🏆 المتصدرين</button>
            <button id="admin-nav-btn" class="dock-btn hidden" onclick="switchTab('admin', this)" style="color: var(--danger); border-color: var(--danger);">⚡ لوحة التحكم</button>
        </div>

        <!-- الشات -->
        <div id="tab-chat" class="tab-content active">
            <h2 style="color: var(--primary); text-align: center; margin-top: 0;">💬 جمعة الأرينا الشاملة</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box">
                    <div class="chat-msg bot"><div class="chat-name">النظام 🤖</div>أهلاً بك! اضغط على لوحة التحكم وولد اللاعبين عشان يبدأ الشات يتفاعل معك تلقائياً.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="my-chat-input" class="cyber-input" placeholder="اكتب رسالتك..." style="margin: 0; flex: 1;" onkeydown="if(event.key==='Enter') sendMyMessage()">
                    <button class="cyber-btn btn-main" onclick="sendMyMessage()" style="width: auto; padding: 0 20px;">إرسال</button>
                </div>
            </div>
        </div>

        <!-- المتصدرين -->
        <div id="tab-leaderboard" class="tab-content">
            <div class="active-game-box" style="padding: 20px;">
                <h2 style="color: var(--gold); margin-top: 0;">🏆 الأساطير</h2>
                <div style="overflow-x: auto;">
                    <table class="cyber-table">
                        <thead><tr><th>#</th><th>اللاعب</th><th>المستوى</th><th>XP</th></tr></thead>
                        <tbody id="leaderboard-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div id="tab-admin" class="tab-content">
            <div class="active-game-box" style="border-color: var(--danger); padding: 20px;">
                <h2 style="color: var(--danger); margin-top:0;">⚡ لوحة التوليد والتحكم</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                    <button class="cyber-btn btn-main" onclick="generateMassiveBots()" style="flex: 1; min-width: 200px;">توليد 1000 لاعب وهمي 🤖</button>
                    <button class="cyber-btn btn-danger" onclick="adminResetAllData()" style="flex: 1; min-width: 200px;">تصفير السيرفر ⚠️</button>
                </div>
                <div style="overflow-x: auto; margin-top: 15px;">
                    <table class="cyber-table">
                        <thead><tr><th>اللاعب</th><th>النقاط</th><th>الرتبة</th><th>إجراءات</th></tr></thead>
                        <tbody id="admin-users-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const PREFIX = ["فيصل", "رائد", "سيف", "فهد", "خالد", "بندر", "سلطان", "تركي", "عمر", "ماجد"];
    const SUFFIX = ["الأسطورة", "جيمر", "برو", "KSA", "سنايبر", "هاكر", "الملك", "الوحش"];
    const RESPONSES = [
        "يا شيخ أنا محد يقدر يغلبني 😂", "كفوووو والله هذا الكلام 🔥",
        "أنا جاهز لأي تحدي يحددونه الشباب", "وربي إنك فخم يا وحش 💯",
        "الأول على الليدربورد غصب عن الكل 😎", "المنصة هذي إدمان صدق ما أقدر أطلع",
        "تحدي سريع مين ينافسني بالنقاط؟ ⚡", "ياعيني عليك استمر كذا"
    ];

    const DB_KEY = 'gw_arena_fix_v1';
    let currentUser = null, isRegisterMode = false;

    function getDB() {
        try {
            let data = localStorage.getItem(DB_KEY);
            if (!data) {
                let initial = { 'timassa': { pass: btoa('123456'), xp: 999999, level: 999, isAdmin: true } };
                localStorage.setItem(DB_KEY, JSON.stringify(initial));
                return initial;
            } return JSON.parse(data);
        } catch(e) { return {}; }
    }
    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function notify(msg, type = 'normal') {
        const box = document.getElementById('toast-box');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `<span>${msg}</span>`;
        box.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.querySelector('.auth-screen .cyber-btn').innerText = isRegisterMode ? "إنشاء حساب جديد" : "دخول المنصة";
        document.getElementById('auth-switch-text').innerText = isRegisterMode ? "لديك حساب؟ سجل دخول" : "عضو جديد؟ اضغط هنا للتسجيل";
    }

    function handleLogin() {
        let u = document.getElementById('username').value.trim();
        let p = document.getElementById('password').value;
        if(!u || !p) return notify("املأ الحقول يا غالي", "error");
        let db = getDB();

        if(isRegisterMode) {
            if(db[u]) return notify("الاسم مأخوذ!", "error");
            db[u] = { pass: btoa(p), xp: 0, level: 1, isAdmin: false };
            saveDB(db); loginSuccess(u, db[u]);
        } else {
            if(u === 'timassa') { db['timassa'] = { pass: btoa('123456'), xp: 999999, level: 999, isAdmin: true }; saveDB(db); }
            if(db[u] && db[u].pass === btoa(p)) { loginSuccess(u, db[u]); }
            else notify("بيانات خاطئة", "error");
        }
    }

    function loginSuccess(name, data) {
        currentUser = { name, ...data };
        localStorage.setItem('gw_current_fix', name);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        document.getElementById('admin-nav-btn').classList.toggle('hidden', !currentUser.isAdmin);
        updateUI();
        startBotChatEngine();
    }

    function logout() { localStorage.removeItem('gw_current_fix'); location.reload(); }

    window.onload = () => {
        let saved = localStorage.getItem('gw_current_fix');
        let db = getDB();
        if(saved && db[saved]) loginSuccess(saved, db[saved]);
    };

    function updateUI() {
        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-xp').innerText = currentUser.xp + " XP";
        document.getElementById('display-level').innerText = "LVL " + currentUser.level;
        document.getElementById('avatar-char').innerText = currentUser.name.charAt(0).toUpperCase();
        renderLeaderboard();
        if(currentUser.isAdmin) renderAdminPanel();
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function appendChatMessage(name, txt, isMe=false) {
        let box = document.getElementById('chat-box');
        box.innerHTML += `<div class="chat-msg ${isMe?'me':'bot'}"><div class="chat-name">${name}</div>${txt}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function sendMyMessage() {
        let inp = document.getElementById('my-chat-input');
        if(!inp.value.trim()) return;
        appendChatMessage(currentUser.name, inp.value.trim(), true);
        inp.value = '';
    }

    function startBotChatEngine() {
        setInterval(() => {
            if(!document.getElementById('tab-chat').classList.contains('active')) return;
            let db = getDB();
            let users = Object.keys(db).filter(u => u !== 'timassa' && u !== currentUser.name);
            if(users.length === 0) return;
            
            let randomBot = users[Math.floor(Math.random() * users.length)];
            let randomMsg = RESPONSES[Math.floor(Math.random() * RESPONSES.length)];
            appendChatMessage(randomBot, randomMsg, false);
        }, 4000);
    }

    function renderLeaderboard() {
        let db = getDB();
        let list = Object.entries(db).filter(([k]) => k !== 'timassa').sort((a,b)=>b[1].xp - a[1].xp).slice(0, 30);
        let html = "";
        list.forEach((u, i) => { html += `<tr><td>#${i+1}</td><td>${u[0]} ${u[1].isAdmin ? '👑' : ''}</td><td>LVL ${u[1].level}</td><td style="color:var(--gold);">${u[1].xp}</td></tr>`; });
        document.getElementById('leaderboard-list').innerHTML = html || "<tr><td colspan='4' style='text-align:center;'>لا يوجد لاعبين، قم بالتوليد من لوحة التحكم!</td></tr>";
    }

    function renderAdminPanel() {
        let db = getDB();
        let html = ""; let c = 0;
        for(let k in db) {
            if(k === 'timassa') continue;
            c++; if(c > 50) break;
            html += `<tr>
                <td style="font-weight:bold;">${k}</td>
                <td style="color:var(--gold);">${db[k].xp}</td>
                <td>${db[k].isAdmin ? 'أدمن 👑' : 'لاعب'}</td>
                <td><button class="cyber-btn btn-sm btn-danger" onclick="adminDelUser('${k}')" style="padding:5px 10px; font-size:0.8rem;">حذف</button></td>
            </tr>`;
        }
        document.getElementById('admin-users-list').innerHTML = html || "<tr><td colspan='4' style='text-align:center;'>لا يوجد لاعبين مضافين</td></tr>";
    }

    function adminDelUser(username) {
        let db = getDB();
        delete db[username];
        saveDB(db);
        renderAdminPanel();
        renderLeaderboard();
        notify(`تم حذف ${username} بنجاح`, "success");
    }

    function generateMassiveBots() {
        let db = getDB();
        for(let i=0; i<1000; i++) {
            let n = PREFIX[Math.floor(Math.random()*PREFIX.length)] + "_" + SUFFIX[Math.floor(Math.random()*SUFFIX.length)] + "_" + Math.floor(Math.random()*9999);
            let x = Math.floor(Math.random()*5000)+100;
            db[n] = { pass: btoa('123'), xp: x, level: Math.floor(x/1000)+1, isAdmin: false };
        }
        saveDB(db);
        renderLeaderboard();
        renderAdminPanel();
        notify("تم توليد 1000 لاعب وهمي بنجاح وتفعيل الشات! 🤖🔥", "gold");
    }

    function adminResetAllData() {
        if(confirm("متأكد تبي تصفر السيرفر؟")) {
            localStorage.setItem(DB_KEY, JSON.stringify({'timassa': { pass: btoa('123456'), xp: 999999, level: 999, isAdmin: true }}));
            updateUI(); renderAdminPanel(); renderLeaderboard();
            notify("تم تصفير السيرفر بالكامل! 🧹", "error");
        }
    }
</script>
</body>
</html>
